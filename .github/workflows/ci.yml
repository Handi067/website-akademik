name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '20'

jobs:
  backend:
    name: Backend · typecheck, unit test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit & contract test
        run: npm run test:coverage -- --ci
      - name: Build
        run: npm run build

  frontend:
    name: Frontend · typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npx vite build

  spec:
    name: OpenAPI · lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Postman CLI
        run: curl -fsSL https://dl-cli.pstmn.io/install/linux64.sh | sh
      - name: Lint spec
        run: postman spec lint postman/specs/website-akademik-api.yaml

  api:
    name: API · Postman collection (Postgres + seed)
    runs-on: ubuntu-latest
    needs: backend
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: db_akademik_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/db_akademik_ci
      JWT_SECRET: ci-jwt-secret
      JWT_REFRESH_SECRET: ci-jwt-refresh-secret
      PORT: '3001'
      RATE_LIMIT_MAX_REQUESTS: '10000'
      SWAGGER_ENABLED: 'false'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Migrate & seed database
        run: |
          npx prisma migrate deploy
          npm run prisma:seed
      - name: Build & start API
        run: |
          npm run build
          nohup node dist/app.js > api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3001/health && exit 0; sleep 1; done
          cat api.log; exit 1
      - name: Install Postman CLI
        run: curl -fsSL https://dl-cli.pstmn.io/install/linux64.sh | sh
      - name: Run collection
        run: npm run test:api
      - name: API log
        if: failure()
        run: cat api.log

  docker:
    name: Docker · build backend image
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: website-akademik-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
