apiVersion: v2
name: auth-service
description: Authentication and authorization microservice for Academic Information System
type: application
version: 1.0.0
appVersion: "1.0.0"
home: https://github.com/academic-system/auth-service
sources:
  - https://github.com/academic-system/auth-service
maintainers:
  - name: Academic System Team
    email: dev@academic-system.com
keywords:
  - authentication
  - authorization
  - jwt
  - microservices
  - academic-system
  - go
  - golang
annotations:
  category: Security
  licenses: MIT
dependencies:
  - name: postgresql
    version: "12.x.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
  - name: redis
    version: "17.x.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled
  - name: kafka
    version: "22.x.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: kafka.enabled
